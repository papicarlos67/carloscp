<!DOCTYPE html>
<html lang="es">

<head>

    <!-- MÉTODO 1: Bootstrap mediante CDN -->

<body class="bg-light p-3">

    <div class="container bg-white p-4 rounded shadow-sm text-center"

        <!-- Lista Horizontal Tipográfica -->
        <ul class="list-inline text-uppercase fw-bold text-primary mb-3 border-bottom pb-2 small">

            <li class="list-inline-item mx-2">Entradas</li>

            <li class="list-inline-item mx-2 text-dark border-bottom border-2 border-dark">

            </li>

            <li class="list-inline-item mx-2">Postres</li>

        </ul>

        <h1 class="display-6 fw-bold text-dark mb-4">

        </h1>

        <!-- Lista Sin Viñetas Tipográfica -->
        <ul class="list-unstyled text-start">

            <li class="mb-3 border-bottom pb-2">

                <p class="h4 fw-bold text-dark mb-0 d-flex justify-content-between">
                    <span>1. Lomo Salteado Gourmet</span>

                </p>

                </p>

            </li>

                    <span>2. Risotto de Champiñones</span>

                </p>

                    Arroz arborio, setas silvestres
                    y queso parmesano.
                </p>

            </li>

        </ul>

    </div>
